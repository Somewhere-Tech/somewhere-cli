# Publish @somewhere-tech/cli to npm WITH PROVENANCE.
#
# Provenance (the signed attestation that links the published tarball to this
# exact repo + commit + CI run) can ONLY be produced from CI with OIDC — a local
# `npm publish` produces none. That's why the first attested release goes through
# here. After this, `swpx check @somewhere-tech/cli` passes its own provenance bar.
#
# Setup (one time):
#   1. Repo → Settings → Secrets → Actions → add NPM_TOKEN (an npm automation
#      token for the @somewhere-tech org, publish scope).
#   2. The repo must be public for the provenance attestation to be public.
# Release:
#   bump version in package.json, commit, then:
#   git tag v0.14.0 && git push origin v0.14.0   (or run this workflow manually)
name: Publish to npm

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token — REQUIRED for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5, but npm 12 REMOVED
      # npm-shrinkwrap.json support from `npm ci` — this repo ships a
      # shrinkwrap and no package-lock, so `npm@latest` fails the next step
      # with EUSAGE and nothing publishes. Reproduced on 2026-09-21: npm
      # 12.0.2 errors on this tree, 11.19.0 installs it. Pinned rather than
      # floating, so a future npm major cannot silently break releases again.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
