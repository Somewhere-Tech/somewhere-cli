# ONE-OFF cross-repo publish of @somewhere-tech/sdk.
#
# Why this lives in the CLI repo and not in the SDK repo:
#   The npm automation token for the @somewhere-tech org exists as a REPO-level
#   secret (NPM_TOKEN) on Somewhere-Tech/somewhere-cli only. It is not an org
#   secret and cannot be read back or copied out of GitHub. The SDK repo
#   (Somewhere-Tech/somewhere-sdk-js) has its own publish.yml but NO secrets, so
#   it cannot publish yet. This workflow borrows this repo's token to unblock the
#   pre-launch 0.7.4 release.
#
# NO --provenance, deliberately:
#   Provenance is an OIDC-signed attestation binding the tarball to the repo and
#   commit of the workflow that published it. Published from here, it would
#   attest Somewhere-Tech/somewhere-cli — the WRONG repo — permanently, on the
#   public transparency log. An unattested publish is the honest option; a
#   confidently wrong attestation is not. Provenance comes back when the SDK repo
#   gets its own NPM_TOKEN and publishes from its own publish.yml.
#
# This workflow is intentionally NOT merged to master. It does not touch the
# CLI's own release path or version guard.
# HOW THIS IS TRIGGERED, and why it is not workflow_dispatch:
#   GitHub only registers a workflow_dispatch workflow if the file exists on the
#   repo's DEFAULT branch. This file is deliberately NOT merged to master, so
#   `gh workflow run` returns 404. A `push` trigger has no such restriction: it
#   runs from the branch it was pushed to. So the knobs below are env vars, and
#   a run is triggered by committing a change to them and pushing this branch.
#   workflow_dispatch is kept as well, for whenever this does land on master.
#
#   PUBLISH_REF  - tag/SHA in the SDK repo to publish
#   DRY_RUN      - 'true' => npm publish --dry-run; 'false' => real publish
name: Publish SDK (cross-repo, one-off)

on:
  push:
    branches: [chore/publish-sdk]
    paths: ['.github/workflows/publish-sdk.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag/SHA in Somewhere-Tech/somewhere-sdk-js to publish'
        required: true
        default: 'v0.7.4'
      dry_run:
        description: 'Dry run (no publish)'
        required: true
        type: choice
        default: 'true'
        options: ['true', 'false']

env:
  PUBLISH_REF: 'v0.7.4'
  DRY_RUN: 'true'

permissions:
  contents: read

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve knobs (workflow_dispatch inputs win, else the env above)
        id: cfg
        run: |
          REF="${{ inputs.ref || env.PUBLISH_REF }}"
          DRY="${{ inputs.dry_run || env.DRY_RUN }}"
          case "$DRY" in
            true|false) ;;
            *) echo "::error::DRY_RUN must be exactly 'true' or 'false', got '$DRY'"; exit 1 ;;
          esac
          echo "ref=$REF"   >> "$GITHUB_OUTPUT"
          echo "dry=$DRY"   >> "$GITHUB_OUTPUT"
          echo "publishing ref=$REF dry_run=$DRY"

      - name: Checkout the SDK repo (public; default token suffices)
        uses: actions/checkout@v4
        with:
          repository: Somewhere-Tech/somewhere-sdk-js
          ref: ${{ steps.cfg.outputs.ref }}
          fetch-depth: 0

      - name: Show what we are about to publish
        run: |
          git log --oneline -1
          echo "resolved sha: $(git rev-parse HEAD)"
          node -e "const p=require('./package.json');console.log(p.name, p.version)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: npm publish --dry-run
        if: ${{ steps.cfg.outputs.dry == 'true' }}
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: npm publish
        if: ${{ steps.cfg.outputs.dry == 'false' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
